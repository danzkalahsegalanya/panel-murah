<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel Bot WA</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    background: #0f0f12; color: #e8e8ea;
    min-height: 100vh; display: flex; justify-content: center;
    padding: 24px 16px;
  }
  .card {
    width: 100%; max-width: 460px;
    background: #1a1a1f; border: 1px solid #2a2a33;
    border-radius: 14px; padding: 24px;
  }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .sub { font-size: 13px; color: #888; margin-bottom: 20px; }

  label.field { display: block; font-size: 13px; margin: 16px 0 6px; color: #bbb; }
  input, select {
    width: 100%; padding: 11px 12px; font-size: 14px;
    background: #0f0f12; border: 1px solid #2a2a33;
    border-radius: 8px; color: #e8e8ea; outline: none;
  }
  input:focus, select:focus { border-color: #4ade80; }

  .node-group { display: flex; gap: 10px; margin-top: 6px; }
  .node-group label {
    flex: 1; padding: 11px; text-align: center; font-size: 13px;
    background: #0f0f12; border: 1px solid #2a2a33; border-radius: 8px;
    cursor: pointer; transition: .15s;
  }
  .node-group input { display: none; }
  .node-group input:checked + span { color: #4ade80; }
  .node-group label:has(input:checked) { border-color: #4ade80; background: #14251a; }

  .total {
    margin-top: 20px; padding: 14px;
    background: #0f0f12; border-radius: 8px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .total span:first-child { font-size: 13px; color: #888; }
  .total span:last-child { font-size: 20px; font-weight: 700; color: #4ade80; }

  button {
    width: 100%; margin-top: 16px; padding: 13px;
    background: #4ade80; color: #0f0f12; font-weight: 700; font-size: 15px;
    border: none; border-radius: 8px; cursor: pointer; transition: .15s;
  }
  button:hover { background: #22c55e; }
  button:disabled { background: #333; color: #666; cursor: not-allowed; }
</style>
</head>
<body>
<form class="card" id="orderForm">
  <h1>Panel Bot WhatsApp</h1>
  <p class="sub">Isi data, pesanan otomatis dikirim ke WhatsApp admin.</p>

  <label class="field">Nama / Username</label>
  <input type="text" id="nama" placeholder="contoh: budi123" required>

  <label class="field">Nomor WhatsApp</label>
  <input type="tel" id="wa" placeholder="08xxxxxxxxxx" required>

  <label class="field">Pilih Node.js</label>
  <div class="node-group">
    <label><input type="radio" name="node" value="Node.js v1" checked><span>Node.js v1</span></label>
    <label><input type="radio" name="node" value="Node.js v2"><span>Node.js v2</span></label>
  </div>

  <label class="field">Pilih RAM</label>
  <select id="ram" required>
    <option value="1GB" data-harga="1000">1 GB — Rp 1.000</option>
    <option value="2GB" data-harga="1500">2 GB — Rp 1.500</option>
    <option value="3GB" data-harga="2000">3 GB — Rp 2.000</option>
    <option value="4GB" data-harga="2500">4 GB — Rp 2.500</option>
    <option value="5GB" data-harga="3000">5 GB — Rp 3.000</option>
    <option value="6GB" data-harga="3500">6 GB — Rp 3.500</option>
    <option value="7GB" data-harga="4000">7 GB — Rp 4.000</option>
    <option value="8GB" data-harga="4500">8 GB — Rp 4.500</option>
    <option value="9GB" data-harga="5000">9 GB — Rp 5.000</option>
    <option value="10GB" data-harga="5500">10 GB — Rp 5.500</option>
    <option value="Unlimited" data-harga="2000">Unlimited — Rp 2.000 ⚡</option>
  </select>

  <div class="total">
    <span>Total Bayar</span>
    <span id="totalText">Rp 1.000</span>
  </div>

  <button type="submit">Pesan via WhatsApp</button>
</form>

<script>
  const ADMIN_WA = "6288906198025";
  const form = document.getElementById("orderForm");
  const ramSel = document.getElementById("ram");
  const totalText = document.getElementById("totalText");

  function rupiah(n) {
    return "Rp " + n.toLocaleString("id-ID");
  }

  function hitungTotal() {
    const opt = ramSel.selectedOptions[0];
    const harga = parseInt(opt.dataset.harga, 10);
    totalText.textContent = rupiah(harga);
    return { ram: opt.value, harga };
  }

  ramSel.addEventListener("change", hitungTotal);
  hitungTotal();

  form.addEventListener("submit", (e) => {
    e.preventDefault();

    const nama = document.getElementById("nama").value.trim();
    const wa = document.getElementById("wa").value.trim();
    const node = form.querySelector('input[name="node"]:checked').value;
    const { ram, harga } = hitungTotal();

    if (!nama || !wa) {
      alert("Nama dan nomor WhatsApp wajib diisi.");
      return;
    }

    const pesan =
`Halo Admin, saya mau order Panel Bot WA.

📋 *DETAIL PESANAN*
• Nama      : ${nama}
• No. WA    : ${wa}
• Node      : ${node}
• RAM       : ${ram}
• Total     : ${rupiah(harga)}

Mohon diproses ya. Terima kasih.`;

    const url = `https://wa.me/${ADMIN_WA}?text=${encodeURIComponent(pesan)}`;
    window.open(url, "_blank");
  });
</script>
</body>
</html>
